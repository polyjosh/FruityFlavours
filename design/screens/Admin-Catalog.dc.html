<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Admin catalog</title>
<link rel="stylesheet" href="../ff.css">
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#2f6b3c}a:hover{color:#265a32}
.tbl td{vertical-align:middle}
</style>
</helmet>
<div class="board" style="width: 2680px; min-height: 1160px; padding: 40px; display: flex; gap: 40px; align-items: flex-start">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column">
      <p class="cap">{{t.name}} · 1280</p>
      <div class="ff {{t.cls}} desk" style="display: flex; min-height: 1020px; font-size: 15px">
        <aside class="side" aria-label="Admin">
          <img class="logo" src="../assets/logo.png" alt="FruityFlavours" style="width: 104px; margin: 0 0 4px 10px">
          <span class="micro muted" style="padding: 0 12px 14px">Admin</span>
          <a class="nav" href="Admin-Orders.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Orders<span class="n">3</span></a>
          <a class="nav on" href="#" aria-current="page"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5l9 4.5 9-4.5M12 12v9"></path></svg>Catalog</a>
          <a class="nav" href="Admin-Reports.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Reports</a>
          <a class="nav" href="Admin-Notifications.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Notifications</a>
          <a class="nav" href="Admin-Settings.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Settings</a>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
            <a class="nav" href="Shop-Desktop.dc.html">View shop</a>
            <a class="nav" href="Admin-SignIn.dc.html">Sign out</a>
          </div>
        </aside>

        <main style="flex: 1; min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; gap: 12px">
            <div style="margin-right: auto"><h1 class="h1">Catalog</h1><p class="small muted">{{count}} products · {{onSale}} on sale</p></div>
            <a class="btn btn-primary" href="Admin-Editor.dc.html"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add product</a>
          </div>
          <div style="display: flex; gap: 8px" role="group" aria-label="Filter products"><button class="pill pill-sm on" type="button" aria-pressed="true">All</button><button class="pill pill-sm" type="button">Drinks</button><button class="pill pill-sm" type="button">Cakes</button><button class="pill pill-sm" type="button">Unavailable</button></div>
          <section class="panel" style="overflow: hidden">
            <sc-raw-table class="tbl">
              <sc-raw-thead><sc-raw-tr><sc-raw-th scope="col" style="padding-left: 18px">Product</sc-raw-th><sc-raw-th scope="col">Options &amp; prices</sc-raw-th><sc-raw-th scope="col">Availability</sc-raw-th><sc-raw-th scope="col" class="r" style="padding-right: 18px">Actions</sc-raw-th></sc-raw-tr></sc-raw-thead>
              <sc-raw-tbody>
                <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
                  <sc-raw-tr>
                    <sc-raw-td style="padding-left: 18px">
                      <div style="display: flex; align-items: center; gap: 12px">
                        <div class="photo thumb" style="background: {{p.bg}}; filter: {{p.thumbFilter}}"><svg width="22" height="28" sc-camel-view-box="0 0 120 150" aria-hidden="true"><path d="M48 8h24v18c0 6 14 12 14 30v78a8 8 0 0 1-8 8H42a8 8 0 0 1-8-8V56c0-18 14-24 14-30z" fill="{{p.fg}}"></path></svg></div>
                        <div style="display: flex; flex-direction: column; gap: 4px"><span class="strong">{{p.name}}</span><span class="badge badge-cat" style="height: 22px; font-size: 12px; align-self: flex-start">{{p.cat}}</span></div>
                      </div>
                    </sc-raw-td>
                    <sc-raw-td><ul style="display: flex; flex-direction: column; gap: 2px"><sc-for list="{{p.opts}}" as="o" hint-placeholder-count="3"><li class="small"><span class="muted">{{o.t}}</span> · <span class="num" style="font-weight: 650">{{o.p}}</span></li></sc-for></ul></sc-raw-td>
                    <sc-raw-td><span class="{{p.chip}}">{{p.avail}}</span></sc-raw-td>
                    <sc-raw-td class="r" style="padding-right: 18px">
                      <div style="display: flex; justify-content: flex-end; gap: 6px">
                        <sc-if value="{{p.canStock}}" hint-placeholder-val="{{true}}"><button class="btn btn-secondary btn-sm" type="button" sc-camel-on-click="{{p.toggle}}" style="min-width: 150px">{{p.stockLabel}}</button></sc-if>
                        <a class="btn btn-secondary btn-sm" href="Admin-Editor.dc.html" aria-label="Edit {{p.name}}"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Edit</a>
                        <sc-if value="{{p.confirming}}" hint-placeholder-val="{{false}}"><button class="btn btn-danger btn-sm" type="button" sc-camel-on-click="{{p.del}}">Tap again to confirm</button></sc-if>
                        <sc-if value="{{p.notConfirming}}" hint-placeholder-val="{{true}}"><button class="btn btn-ghost btn-sm" type="button" sc-camel-on-click="{{p.del}}" aria-label="Delete {{p.name}}" style="color: var(--berry-text)"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>Delete</button></sc-if>
                      </div>
                    </sc-raw-td>
                  </sc-raw-tr>
                </sc-for>
              </sc-raw-tbody>
            </sc-raw-table>
          </section>
        </main>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:2680,&quot;height&quot;:1160}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      avail: { gg: 'sale', sm: 'sale', bb: 'sale', bo: 'sale', cc: 'oos', pm: 'soon', ck: 'sale', gs: 'hidden' },
      confirm: 'bb',
      deleted: {}
    };
  }
  renderVals() {
    const P = [
      { id: 'gg', name: 'Green Glow', cat: 'Drinks', bg: '#d5e8c0', fg: '#4f7f33', opts: [{ t: 'Single, 500 ml', p: 'KES 400' }, { t: '7 × 70 ml', p: 'KES 1,500' }, { t: '7 × 1 L', p: 'KES 2,600' }] },
      { id: 'sm', name: 'Sunrise Mango', cat: 'Drinks', bg: '#ffd59a', fg: '#e0861c', opts: [{ t: 'Single, 500 ml', p: 'KES 450' }, { t: '7 × 70 ml', p: 'KES 1,600' }, { t: '7 × 1 L', p: 'KES 2,800' }] },
      { id: 'bb', name: 'Beet Boost', cat: 'Drinks', bg: '#f3c6d0', fg: '#a3304f', opts: [{ t: 'Single, 500 ml', p: 'KES 400' }, { t: '7 × 70 ml', p: 'KES 1,500' }, { t: '7 × 1 L', p: 'KES 2,600' }] },
      { id: 'bo', name: 'Berry Oat Smoothie', cat: 'Drinks', bg: '#e6d3ea', fg: '#7a3f86', opts: [{ t: 'Single, 350 ml', p: 'KES 450' }] },
      { id: 'cc', name: 'Coconut Cooler', cat: 'Drinks', bg: '#ece6d8', fg: '#8b7a5a', opts: [{ t: 'Single, 500 ml', p: 'KES 380' }] },
      { id: 'pm', name: 'Pineapple Mint Fizz', cat: 'Drinks', bg: '#f6eaa6', fg: '#a58d12', opts: [{ t: 'Single, 330 ml', p: 'Price not set' }] },
      { id: 'ck', name: 'Carrot Cake', cat: 'Cakes', bg: '#f5d3b0', fg: '#b8642a', opts: [{ t: '500 g cake', p: 'KES 1,200' }, { t: '1 kg cake', p: 'KES 2,200' }, { t: '2 kg cake', p: 'KES 4,000' }] },
      { id: 'gs', name: 'Ginger Shot (draft)', cat: 'Drinks', bg: '#f3e2b3', fg: '#a8761c', opts: [{ t: 'Single, 60 ml', p: 'KES 150' }] }
    ];
    const meta = {
      sale: { label: 'On sale', chip: 'chip chip-ready' },
      oos: { label: 'Out of stock', chip: 'chip chip-cancel' },
      soon: { label: 'Coming soon', chip: 'chip chip-prep' },
      hidden: { label: 'Hidden', chip: 'chip chip-await' }
    };
    const s = this.state;
    const list = P.filter((p) => !s.deleted[p.id]);
    return {
      themes: [{ name: 'Light', cls: 'th-light' }, { name: 'Dark', cls: 'th-dark' }],
      count: list.length,
      onSale: list.filter((p) => s.avail[p.id] === 'sale').length,
      products: list.map((p) => {
        const a = s.avail[p.id];
        return {
          ...p,
          avail: meta[a].label,
          chip: meta[a].chip,
          thumbFilter: a === 'oos' ? 'grayscale(1)' : 'none',
          canStock: a === 'sale' || a === 'oos',
          stockLabel: a === 'oos' ? 'Back in stock' : 'Mark out of stock',
          toggle: () => this.setState({ avail: { ...s.avail, [p.id]: a === 'oos' ? 'sale' : 'oos' } }),
          confirming: s.confirm === p.id,
          notConfirming: s.confirm !== p.id,
          del: () => s.confirm === p.id ? this.setState({ deleted: { ...s.deleted, [p.id]: true }, confirm: null }) : this.setState({ confirm: p.id })
        };
      })
    };
  }
}
</script>


</body></html>
