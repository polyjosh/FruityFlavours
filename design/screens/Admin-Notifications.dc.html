<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Admin notifications log</title>
<link rel="stylesheet" href="../ff.css">
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#2f6b3c}a:hover{color:#265a32}
</style>
</helmet>
<div class="board" style="width: 2680px; min-height: 960px; padding: 40px; display: flex; gap: 40px; align-items: flex-start">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column">
      <p class="cap">{{t.name}} · 1280</p>
      <div class="ff {{t.cls}} desk" style="display: flex; min-height: 820px; font-size: 15px">
        <aside class="side" aria-label="Admin">
          <img class="logo" src="../assets/logo.png" alt="FruityFlavours" style="width: 104px; margin: 0 0 4px 10px">
          <span class="micro muted" style="padding: 0 12px 14px">Admin</span>
          <a class="nav" href="Admin-Orders.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Orders<span class="n">3</span></a>
          <a class="nav" href="Admin-Catalog.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5l9 4.5 9-4.5M12 12v9"></path></svg>Catalog</a>
          <a class="nav" href="Admin-Reports.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Reports</a>
          <a class="nav on" href="#" aria-current="page"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Notifications</a>
          <a class="nav" href="Admin-Settings.dc.html"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Settings</a>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px"><a class="nav" href="Shop-Desktop.dc.html">View shop</a><a class="nav" href="Admin-SignIn.dc.html">Sign out</a></div>
        </aside>

        <main style="flex: 1; min-width: 0; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 18px">
          <div><h1 class="h1">Notifications log</h1><p class="small muted">Every SMS sent to customers and to the shop. Failed messages can be resent.</p></div>
          <div style="display: flex; gap: 8px" role="group" aria-label="Filter messages"><button class="pill pill-sm on" type="button" aria-pressed="true">All · 8</button><button class="pill pill-sm" type="button">Sent · 7</button><button class="pill pill-sm" type="button">Failed · 1</button></div>
          <section class="panel" style="overflow: hidden">
            <sc-raw-table class="tbl">
              <sc-raw-thead><sc-raw-tr><sc-raw-th scope="col" style="padding-left: 18px; width: 140px">Time</sc-raw-th><sc-raw-th scope="col" style="width: 200px">Recipient</sc-raw-th><sc-raw-th scope="col">Message</sc-raw-th><sc-raw-th scope="col" class="r" style="padding-right: 18px; width: 170px">Status</sc-raw-th></sc-raw-tr></sc-raw-thead>
              <sc-raw-tbody>
                <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                  <sc-raw-tr>
                    <sc-raw-td style="padding-left: 18px" class="num muted">{{r.time}}</sc-raw-td>
                    <sc-raw-td><div style="display: flex; flex-direction: column"><span style="font-weight: 650">{{r.name}}</span><span class="small muted num">{{r.phone}}</span></div></sc-raw-td>
                    <sc-raw-td class="small">{{r.msg}}</sc-raw-td>
                    <sc-raw-td class="r" style="padding-right: 18px">
                      <sc-if value="{{r.ok}}" hint-placeholder-val="{{true}}"><span class="chip chip-ready">Sent</span></sc-if>
                      <sc-if value="{{r.failed}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span class="chip chip-fail">Failed</span><span style="font-size: 12px" class="muted">Number unreachable</span><button class="btn btn-secondary btn-sm" type="button">Resend</button></div></sc-if>
                    </sc-raw-td>
                  </sc-raw-tr>
                </sc-for>
              </sc-raw-tbody>
            </sc-raw-table>
          </section>
        </main>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:2680,&quot;height&quot;:960}}">
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { time: 'Today 10:43', name: 'Shop (admin)', phone: '0700 123 456', msg: 'New order #FF-1044: Kevin Mwangi, KES 1,650, pickup at Main shop.', ok: true },
      { time: 'Today 10:43', name: 'Kevin Mwangi', phone: '0733 902 114', msg: 'Asante! Order #FF-1044 received. Pay when you pick it up at Main shop – Ongata Rongai.', ok: true },
      { time: 'Today 10:14', name: 'Wanjiru Kamau', phone: '0712 345 678', msg: 'Payment received for #FF-1043 (KES 2,550, TJK8H2LQ4P). We are preparing it now.', ok: true },
      { time: 'Today 09:56', name: 'Achieng Odhiambo', phone: '0798 221 430', msg: 'Order #FF-1042 is waiting for payment. Check your phone for the M-Pesa prompt.', ok: false },
      { time: 'Today 09:31', name: 'Peter Kiprono', phone: '0701 556 872', msg: 'Order #FF-1041 is ready at Rongai Gate Kiosk. See you soon!', ok: true },
      { time: 'Today 09:05', name: 'Faith Njeri', phone: '0720 118 344', msg: 'Order #FF-1040 is out for delivery. Our rider will call when close.', ok: true },
      { time: 'Yest. 17:52', name: 'Samuel Mutua', phone: '0711 870 225', msg: 'Order #FF-1039 is complete. Thank you for choosing FruityFlavours!', ok: true },
      { time: 'Yest. 17:31', name: 'Samuel Mutua', phone: '0711 870 225', msg: 'Payment received for #FF-1039 (KES 800, TJJ4K8PL2C).', ok: true }
    ];
    return {
      themes: [{ name: 'Light', cls: 'th-light' }, { name: 'Dark', cls: 'th-dark' }],
      rows: rows.map((r) => ({ ...r, failed: !r.ok }))
    };
  }
}
</script>


</body></html>
